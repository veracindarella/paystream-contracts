# Codecov configuration for PayStream Contracts
# https://docs.codecov.com/docs/codecov-yaml
#
# Coverage gates (both enforced as required status checks):
#   - project: 80% floor across the whole project. CI fails if project
#     coverage drops below this floor (with a small 1% tolerance for noise).
#   - patch: 80% of new lines in a PR must be covered by tests.
#     CI fails if a PR reduces patch coverage below this threshold.
#
# Per-flag coverage is tracked for the individual contracts so regressions
# in a specific contract are visible even when the aggregate stays healthy.
#
# Rationale: enforcing both a project floor and patch coverage prevents
# gradual coverage erosion while ensuring every new feature or bug-fix
# ships with adequate test coverage.

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        # Enforced project-wide coverage floor. Regressions fail the check.
        target: 80%
        threshold: 1%
        if_ci_failed: error
        informational: false

    patch:
      default:
        # Minimum patch coverage for any PR touching the codebase.
        target: 80%
        threshold: 0%
        # Do not block on Codecov upload errors; test failures should gate CI.
        if_ci_failed: success
        informational: false

# Per-contract coverage flags. Each flag is reported independently so
# coverage of an individual contract can be tracked and gated.
flags:
  stream:
    paths:
      - contracts/stream/
    carryforward: true
  token:
    paths:
      - contracts/token/
    carryforward: true

flag_management:
  default_rules:
    carryforward: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignore generated, vendored, and infrastructure files.
ignore:
  - "target/**"
  - "**/*.json"
  - "scripts/**"
  - "docs/**"
  - "audits/**"
  - "benchmarks/**"
  - "tests/integration/**"
  - "contracts/stream/fuzz/**"