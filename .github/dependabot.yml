version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - devops
    assignees:
      - veracindarella
    reviewers:
      - veracindarella
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/examples/dashboard"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - devops
    assignees:
      - veracindarella
    reviewers:
      - veracindarella
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - devops
    assignees:
      - veracindarella
    reviewers:
      - veracindarella
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch