name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 27.0.0

jobs:
  test:
    name: Build & Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    # Nightly failures are reported but do not block the workflow.
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        # pinned = channel from rust-toolchain.toml, msrv = rust-version from Cargo.toml
        toolchain: [pinned, stable, beta, msrv, nightly]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.toolchain.outputs.name }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-

      - name: Check formatting
        if: matrix.toolchain == 'pinned'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.toolchain == 'pinned'
        run: cargo clippy --all-targets -- -D warnings

      - name: Check public API documentation
        if: matrix.toolchain == 'pinned'
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p paystream-stream --no-deps

      - name: Test
        run: cargo test

      - name: Report nightly failure
        if: failure() && matrix.toolchain == 'nightly'
        run: |
          echo "::warning::Tests failed on nightly Rust (non-blocking)"
          echo "⚠️ Nightly Rust build/tests failed (non-blocking)." >> "$GITHUB_STEP_SUMMARY"

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Build contracts
        run: stellar contract build

      - name: Check WASM sizes
        run: |
          MAX=$((128 * 1024))   # Soroban contract size limit
          WARN=$((100 * 1024))  # ~20% buffer
          status=0
          {
            echo "### WASM sizes"
            echo ""
            echo "| Contract | Size (bytes) | Size (KB) | Status |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in target/wasm32-unknown-unknown/release/*.wasm; do
            size=$(stat -c %s "$f")
            name=$(basename "$f")
            if [ "$size" -gt "$MAX" ]; then
              state="❌ exceeds 128 KB"
              echo "::error file=$f::$name is $size bytes, exceeding the 128 KB limit"
              status=1
            elif [ "$size" -gt "$WARN" ]; then
              state="⚠️ exceeds 100 KB"
              echo "::warning file=$f::$name is $size bytes, approaching the 128 KB limit"
            else
              state="✅ ok"
            fi
            echo "| $name | $size | $((size / 1024)) | $state |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - name: Check contract interface diff
        run: |
          WASM=target/wasm32-unknown-unknown/release/paystream_stream.wasm
          BASELINE=contracts/stream/interface.json
          GENERATED=$(mktemp)

          if [ ! -f "$WASM" ]; then
            echo "::error::Compiled WASM not found at $WASM"
            exit 1
          fi
          if [ ! -f "$BASELINE" ]; then
            echo "::error::Committed interface spec not found at $BASELINE"
            exit 1
          fi

          stellar contract bindings json --wasm "$WASM" --output "$GENERATED"

          if ! diff -u "$BASELINE" "$GENERATED"; then
            {
              echo "### ❌ Contract interface changed"
              echo ""
              echo "The public interface of the stream contract differs from the committed"
              echo "baseline at \`$BASELINE\`. This is a breaking change for clients."
              echo ""
              echo "If the change is intentional, regenerate the baseline and commit it:"
              echo ""
              echo '```'
              echo "stellar contract bindings json --wasm $WASM --output $BASELINE"
              echo '```'
              echo ""
              echo "See CONTRIBUTING.md for details."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=$BASELINE::Contract interface changed; see diff above and CONTRIBUTING.md"
            exit 1
          fi

          echo "Contract interface matches committed baseline."

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-contracts
          path: target/wasm32-unknown-unknown/release/*.wasm

  docs-quickstart:
    name: Validate SDK quickstart examples
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-contracts
          path: target/wasm32-unknown-unknown/release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/quickstart/typescript/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TypeScript example dependencies
        working-directory: docs/quickstart/typescript
        run: npm ci

      - name: Type-check TypeScript example
        working-directory: docs/quickstart/typescript
        run: npx tsc --noEmit

      - name: Install Python example dependencies
        working-directory: docs/quickstart/python
        run: pip install -r requirements.txt

      - name: Compile Python example
        working-directory: docs/quickstart/python
        run: python -m compileall -q .

      - name: Start local Stellar sandbox
        run: |
          stellar network container start local || true
          stellar network container logs local >/dev/null 2>&1 || true

      - name: Run TypeScript quickstart (create/withdraw/query)
        working-directory: docs/quickstart/typescript
        env:
          STELLAR_NETWORK: local
          STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
          STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
        run: npm run quickstart

      - name: Run Python quickstart (create/withdraw/query)
        working-directory: docs/quickstart/python
        env:
          STELLAR_NETWORK: local
          STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
          STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
        run: python quickstart.py

      - name: Stop local Stellar sandbox
        if: always()
        run: stellar network container stop local || true

  scheduled-summary:
    name: Scheduled CI summary
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [test, build-wasm, docs-quickstart]
    runs-on: ubuntu-latest
    steps:
      - name: Report scheduled results
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WASM_RESULT: ${{ needs.build-wasm.result }}
          DOCS_RESULT: ${{ needs.docs-quickstart.result }}
        run: |
          {
            echo "## Weekly scheduled CI"
            echo ""
            echo "- Toolchain matrix: $TEST_RESULT"
            echo "- WASM build: $WASM_RESULT"
            echo "- SDK quickstart examples: $DOCS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TEST_RESULT" == "failure" || "$WASM_RESULT" == "failure" || "$DOCS_RESULT" == "failure" ]]; then
            echo "A scheduled CI job failed. Review the failed job logs above."
          else
            echo "Scheduled CI completed without blocking failures."
          fi
