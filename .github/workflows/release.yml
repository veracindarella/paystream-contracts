name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_mainnet:
        description: 'Deploy to mainnet (manual only)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: 27.0.0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build & Release WASM
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts
        run: stellar contract build

      - name: Generate SHA256 checksums
        id: hash
        run: |
          cd target/wasm32-unknown-unknown/release
          sha256sum *.wasm > checksums.sha256
          cat checksums.sha256
          echo "hashes=$(base64 -w0 checksums.sha256)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign WASM artifacts with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd target/wasm32-unknown-unknown/release
          for wasm in *.wasm; do
            cosign sign-blob \
              --yes \
              --bundle "${wasm}.cosign.bundle" \
              "${wasm}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/wasm32-unknown-unknown/release/*.wasm
            target/wasm32-unknown-unknown/release/*.cosign.bundle
            target/wasm32-unknown-unknown/release/checksums.sha256
          generate_release_notes: true

      - name: Update CHANGELOG.md with release notes
        run: |
          chmod +x scripts/update-changelog.sh
          ./scripts/update-changelog.sh "${GITHUB_REF_NAME}" "${{ github.repository }}" "${{ secrets.GITHUB_TOKEN }}"
          
          # Configure git and commit the changes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload WASM for testnet deploy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm

  publish-image:
    name: Publish container image to GHCR
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-stage image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-testnet:
    name: Deploy to testnet
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Set repository variable TESTNET_DRY_RUN=true to skip deploying and committing.
      DRY_RUN: ${{ vars.TESTNET_DRY_RUN == 'true' }}
      HAS_SECRET: ${{ secrets.TESTNET_ADMIN_SECRET != '' }}
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
    steps:
      - name: Check deploy flag
        id: flag
        run: |
          # Optional: the deploy is skipped unless TESTNET_ADMIN_SECRET is configured.
          if [ "$HAS_SECRET" != "true" ]; then
            echo "::notice::TESTNET_ADMIN_SECRET not set; skipping testnet deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.flag.outputs.enabled == 'true'
        with:
          ref: main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.flag.outputs.enabled == 'true'
        with:
          name: release-wasm
          path: target/wasm32-unknown-unknown/release

      - name: Install Stellar CLI
        if: steps.flag.outputs.enabled == 'true' && env.DRY_RUN != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Deploy contracts
        id: deploy
        if: steps.flag.outputs.enabled == 'true'
        env:
          # Read by the Stellar CLI as the source account; never passed on the command line.
          STELLAR_ACCOUNT: ${{ secrets.TESTNET_ADMIN_SECRET }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would deploy $(ls target/wasm32-unknown-unknown/release/*.wasm)"
            exit 0
          fi
          deploy() {
            stellar contract deploy --wasm "target/wasm32-unknown-unknown/release/$1"
          }
          echo "token=$(deploy paystream_token.wasm)" >> "$GITHUB_OUTPUT"
          echo "stream=$(deploy paystream_stream.wasm)" >> "$GITHUB_OUTPUT"

      - name: Verify deployed WASM checksums
        if: steps.flag.outputs.enabled == 'true' && env.DRY_RUN != 'true'
        env:
          TOKEN_ID: ${{ steps.deploy.outputs.token }}
          STREAM_ID: ${{ steps.deploy.outputs.stream }}
        run: |
          set -euo pipefail
          WASM_DIR="target/wasm32-unknown-unknown/release"
          {
            echo "## Post-deploy WASM checksum verification"
            echo ""
            echo "| Contract | Local SHA256 | Deployed WASM hash | Result |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          verify() {
            local name="$1" wasm="$2" contract_id="$3"
            if [ -z "$contract_id" ]; then
              echo "::error::No contract ID for $name; cannot verify checksum"
              echo "| $name | n/a | n/a | ❌ missing contract ID |" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            local local_hash deployed_hash
            local_hash=$(sha256sum "$WASM_DIR/$wasm" | awk '{print $1}')
            deployed_hash=$(stellar contract info --id "$contract_id" --network testnet 2>/dev/null \
              | grep -iE 'wasm.?hash' | head -n1 | grep -oE '[0-9a-fA-F]{64}' | tr 'A-F' 'a-f' || true)
            if [ -z "$deployed_hash" ]; then
              echo "::error::Could not extract WASM hash for $name ($contract_id)"
              echo "| $name | \`$local_hash\` | n/a | ❌ hash not found |" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
            if [ "$local_hash" = "$deployed_hash" ]; then
              echo "::notice::$name checksum verified ($local_hash)"
              echo "| $name | \`$local_hash\` | \`$deployed_hash\` | ✅ match |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$name checksum mismatch: local=$local_hash deployed=$deployed_hash"
              echo "| $name | \`$local_hash\` | \`$deployed_hash\` | ❌ mismatch |" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }

          status=0
          verify "PayStream Token" paystream_token.wasm "$TOKEN_ID" || status=1
          verify "PayStream Stream" paystream_stream.wasm "$STREAM_ID" || status=1
          exit "$status"

      - name: Update docs/testnet.md
        if: steps.flag.outputs.enabled == 'true' && env.DRY_RUN != 'true'
        env:
          TOKEN_ID: ${{ steps.deploy.outputs.token }}
          STREAM_ID: ${{ steps.deploy.outputs.stream }}
        run: |
          sed -i \
            -e "s/^| PayStream Token | .* |$/| PayStream Token | \`$TOKEN_ID\` |/" \
            -e "s/^| PayStream Stream | .* |$/| PayStream Stream | \`$STREAM_ID\` |/" \
            -e "s/^Last deployed: .*/Last deployed: **$(date -u +%F)** (${GITHUB_REF_NAME})/" \
            docs/testnet.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/testnet.md
          git commit -m "docs: update testnet contract IDs for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  mainnet-dry-run:
    name: Mainnet deploy dry-run
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      STELLAR_RPC_URL: https://soroban-mainnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: Public Global Stellar Network ; September 2015
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-wasm
          path: target/wasm32-unknown-unknown/release

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Dry-run mainnet deploy
        env:
          # Read by the Stellar CLI as the source account; never passed on the command line.
          STELLAR_ACCOUNT: ${{ secrets.MAINNET_ADMIN_SECRET }}
        run: |
          # Fails the job (non-zero exit) if any contract cannot be deployed to mainnet.
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            echo "Dry-run deploying ${wasm} to mainnet"
            stellar contract deploy --dry-run --wasm "${wasm}"
          done

  deploy-mainnet:
    name: Deploy to mainnet (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_mainnet
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      STELLAR_RPC_URL: https://soroban-mainnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: Public Global Stellar Network ; September 2015
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Build contracts
        run: stellar contract build

      - name: Deploy contracts to mainnet
        env:
          # Read by the Stellar CLI as the source account; never passed on the command line.
          STELLAR_ACCOUNT: ${{ secrets.MAINNET_ADMIN_SECRET }}
        run: |
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            echo "Deploying ${wasm} to mainnet"
            stellar contract deploy --wasm "${wasm}"
          done
