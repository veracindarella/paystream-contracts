name: Fuzz

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  fuzz:
    name: Proptest fuzz claimable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-

      - name: Run proptest fuzz (1 000 000 iterations) — claimable
        run: cargo test --package paystream-stream-fuzz --bin fuzz_claimable

      - name: Run proptest fuzz (1 000 000 iterations) — withdraw
        run: cargo test --package paystream-stream-fuzz --bin fuzz_withdraw

      - name: Run proptest fuzz (1 000 000 iterations) — create_stream
        run: cargo test --package paystream-stream-fuzz --bin fuzz_create_stream

      - name: Run proptest fuzz (500 000 iterations) — admin nonce
        run: cargo test --package paystream-stream-fuzz --bin fuzz_admin_nonce
