[workspace]
resolver = "2"
members = [
    "contracts/stream",
    "contracts/token",
    "contracts/stream/fuzz",
]

[workspace.package]
rust-version = "1.84.0"

[workspace.dependencies]
soroban-sdk = { version = "28.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
