services:
  build:
    build:
      context: .
      target: runtime
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-contract:${IMAGE_TAG:-latest}

  test:
    build:
      context: .
      target: test
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    command: cargo test

  # Indexer service.
  #
  # Network selection is driven entirely by environment variables so the same
  # compose file runs against testnet or mainnet without edits:
  #   NETWORK              - network name (testnet | mainnet)
  #   NETWORK_PASSPHRASE   - Stellar network passphrase (must match NETWORK)
  #   RPC_URL              - Soroban RPC endpoint for the selected network
  #   STREAM_CONTRACT_ID   - stream contract ID deployed on the selected network
  #
  # Ingest mode:
  #   INGEST_MODE          - live | backfill | catchup
  #     * live     - follow the chain from the current tip
  #     * backfill - replay events from BACKFILL_START_LEDGER (or genesis)
  #     * catchup  - resume from the persisted high-water mark in CURSOR_PATH
  #
  # NOTE: backfill and live modes are mutually exclusive. Run backfill (or
  # catchup) to completion before switching INGEST_MODE to live; the indexer
  # refuses to start if both are requested simultaneously.
  indexer:
    build:
      context: .
      target: runtime
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-contract:${IMAGE_TAG:-latest}
    command: ["indexer"]
    environment:
      NETWORK: ${NETWORK:-testnet}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      RPC_URL: ${RPC_URL:-https://soroban-testnet.stellar.org}
      STREAM_CONTRACT_ID: ${STREAM_CONTRACT_ID:-}
      INGEST_MODE: ${INGEST_MODE:-live}
      BACKFILL_START_LEDGER: ${BACKFILL_START_LEDGER:-0}
      CURSOR_PATH: ${CURSOR_PATH:-/data/indexer-cursor.json}
    volumes:
      - indexer-data:/data
    restart: unless-stopped

  # Optional dashboard/API service. Uses the same network configuration as the
  # indexer so both components agree on passphrase, RPC and contract IDs.
  dashboard:
    build:
      context: .
      target: runtime
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-contract:${IMAGE_TAG:-latest}
    command: ["dashboard"]
    environment:
      NETWORK: ${NETWORK:-testnet}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      RPC_URL: ${RPC_URL:-https://soroban-testnet.stellar.org}
      STREAM_CONTRACT_ID: ${STREAM_CONTRACT_ID:-}
      CURSOR_PATH: ${CURSOR_PATH:-/data/indexer-cursor.json}
    volumes:
      - indexer-data:/data
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - indexer
    restart: unless-stopped

volumes:
  cargo-cache:
  indexer-data: