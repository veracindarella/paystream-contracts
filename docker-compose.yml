services:
  build:
    build:
      context: .
      target: runtime
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-contract:${IMAGE_TAG:-latest}

  test:
    build:
      context: .
      target: test
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    command: cargo test

  indexer:
    build:
      context: .
      target: indexer
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-indexer:${IMAGE_TAG:-latest}
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://stream:stream@postgres:5432/stream_indexer}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      STREAM_CONTRACT_ID: ${STREAM_CONTRACT_ID:-}
      METRICS_PORT: ${METRICS_PORT:-9090}
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
      - "${METRICS_PORT:-9090}:${METRICS_PORT:-9090}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stream}
      POSTGRES_DB: ${POSTGRES_DB:-stream_indexer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

volumes:
  cargo-cache:
  postgres-data: