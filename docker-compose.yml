services:
  build:
    build:
      context: .
      target: runtime
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-contract:${IMAGE_TAG:-latest}

  test:
    build:
      context: .
      target: test
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    command: cargo test

  backend-build:
    build:
      context: .
      target: backend
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-backend:${IMAGE_TAG:-latest}

  backend-test:
    build:
      context: .
      target: backend-test
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
    command: cargo test --workspace --all-features
    environment:
      DATABASE_URL: postgres://stream:stream@postgres:5432/stream
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      STREAM_CONTRACT_ID: ${STREAM_CONTRACT_ID:-}
      START_LEDGER: ${START_LEDGER:-0}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stream}
      POSTGRES_DB: ${POSTGRES_DB:-stream}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stream} -d ${POSTGRES_DB:-stream}"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer:
    build:
      context: .
      target: backend
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-backend:${IMAGE_TAG:-latest}
    command: ["indexer"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://stream:stream@postgres:5432/stream}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      STREAM_CONTRACT_ID: ${STREAM_CONTRACT_ID:-}
      START_LEDGER: ${START_LEDGER:-0}
      INDEXER_POLL_INTERVAL_MS: ${INDEXER_POLL_INTERVAL_MS:-5000}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  webhook-relay:
    build:
      context: .
      target: backend
    image: ghcr.io/${GITHUB_REPOSITORY:-local}/stream-backend:${IMAGE_TAG:-latest}
    command: ["webhook-relay"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://stream:stream@postgres:5432/stream}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-change-me-in-production}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_BASE_BACKOFF_MS: ${WEBHOOK_BASE_BACKOFF_MS:-500}
      WEBHOOK_RELAY_POLL_INTERVAL_MS: ${WEBHOOK_RELAY_POLL_INTERVAL_MS:-2000}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      indexer:
        condition: service_started
    restart: unless-stopped

volumes:
  cargo-cache:
  postgres-data:
